name: Check Ernakulam Holiday Status

on:
  schedule:
    - cron: '*/15 * * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run check script
        run: node scripts/fetch-status.js
        env:
          TVM_RSS_URL: ${{ secrets.TVM_RSS_URL }}
          KLM_RSS_URL: ${{ secrets.KLM_RSS_URL }}
          PTA_RSS_URL: ${{ secrets.PTA_RSS_URL }}
          ALP_RSS_URL: ${{ secrets.ALP_RSS_URL }}
          KTM_RSS_URL: ${{ secrets.KTM_RSS_URL }}
          IDK_RSS_URL: ${{ secrets.IDK_RSS_URL }}
          EKM_RSS_URL: ${{ secrets.EKM_RSS_URL }}
          TCR_RSS_URL: ${{ secrets.TCR_RSS_URL }}
          PKD_RSS_URL: ${{ secrets.PKD_RSS_URL }}
          MLP_RSS_URL: ${{ secrets.MLP_RSS_URL }}
          KKD_RSS_URL: ${{ secrets.KKD_RSS_URL }}
          WYD_RSS_URL: ${{ secrets.WYD_RSS_URL }}
          KNR_RSS_URL: ${{ secrets.KNR_RSS_URL }}
          KSD_RSS_URL: ${{ secrets.KSD_RSS_URL }}

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated status update"
          file_pattern: "public/status.json"
